<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e10" />
    <title>Convia — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        background: #0e0e10; color: #f4f4f5; font-family: system-ui, sans-serif;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      h1 { font-size: 20px; margin: 0 0 10px; }
      p { color: #a1a1aa; font-size: 14px; line-height: 1.45; max-width: 280px; margin: 0 auto 24px; }
      button {
        height: 48px; padding: 0 28px; border: none; border-radius: 999px;
        background: #22c55e; color: #052e16; font-weight: 700; font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You’re offline</h1>
      <p>Balances and payments need a connection. Open Convia once online so the app shell can load instantly next time.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
